[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puncheur"
version = "0.1.0"
description = "Own the group ride. Post-ride analysis and pre-ride strategy for competitive road cyclists."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Brendan Davis" },
]
keywords = ["cycling", "power", "analysis", "training", "strava", "fit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fitparse>=0.6.0",
    "gpxpy>=1.6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "jinja2>=3.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "geopy>=2.3.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
puncheur = "puncheur.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/puncheur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
